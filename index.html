<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amphitheater - Streaming & Chat</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase App & Realtime Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <!-- YouTube API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col antialiased selection:bg-purple-500 selection:text-white">

  <!-- LOBBY DE INGRESO / CREACIÓN DE SALA -->
  <div id="lobby" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/95 backdrop-blur-md">
    <div class="w-full max-w-md bg-slate-900 border border-purple-500/20 rounded-3xl p-8 shadow-2xl shadow-purple-950/50">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 shadow-lg shadow-purple-500/30 mb-4">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <h1 class="text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-400 to-indigo-300">AMPHITHEATER</h1>
        <p class="text-slate-400 text-sm mt-1">Tu espacio para sincronizar videos y platicar con tu IA en tiempo real.</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Tu Apodo</label>
          <input type="text" id="input-username" placeholder="Ej: Alejandro" class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500 transition">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Nombre o ID de la Sala</label>
          <input type="text" id="input-room" placeholder="Ej: cine-romantico" class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500 transition">
        </div>

        <button id="btn-enter" class="w-full mt-2 bg-gradient-to-r from-purple-600 via-pink-600 to-indigo-600 hover:opacity-95 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-purple-600/30 transition transform active:scale-95 flex items-center justify-center gap-2">
          <span>Unirse a la Sala</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- INTERFAZ PRINCIPAL DE AMPHITHEATER -->
  <div id="app" class="flex-1 flex flex-col lg:flex-row h-screen overflow-hidden">
    
    <!-- ÁREA REPRODUCTOR PRINCIPAL -->
    <div class="flex-1 flex flex-col bg-slate-950 relative overflow-hidden">
      
      <!-- BARRA SUPERIOR -->
      <header class="h-16 bg-slate-900/80 backdrop-blur border-b border-slate-800/80 px-6 flex items-center justify-between z-20">
        <div class="flex items-center gap-3">
          <span class="font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">AMPHITHEATER</span>
          <span id="badge-room" class="bg-purple-500/10 text-purple-300 border border-purple-500/20 text-xs px-3 py-1 rounded-full font-medium">Sala: -</span>
        </div>
        <div class="flex items-center gap-3">
          <button id="btn-share-link" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
            Copiar Enlace
          </button>
        </div>
      </header>

      <!-- PANTALLA DE REPRODUCCIÓN -->
      <div class="flex-1 relative bg-black flex items-center justify-center">
        <!-- Reproductor YouTube -->
        <div id="yt-container" class="absolute inset-0 w-full h-full">
          <div id="yt-player" class="w-full h-full"></div>
        </div>

        <!-- Reproductor Video Directo Web -->
        <video id="web-player" class="absolute inset-0 w-full h-full object-contain hidden" controls></video>

        <!-- Placeholder Sin Contenido -->
        <div id="empty-state" class="text-center p-8 z-10 hidden">
          <div class="w-20 h-20 mx-auto mb-4 rounded-3xl bg-purple-950/50 border border-purple-500/20 flex items-center justify-center text-purple-400">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          </div>
          <h2 class="text-xl font-bold text-white mb-2">Ningún video reproduciéndose</h2>
          <p class="text-slate-400 text-sm max-w-md mx-auto">Pega una URL de YouTube o un enlace MP4 directo para comenzar la transmisión.</p>
        </div>
      </div>

      <!-- CONTROLES Y CARGA DE CONTENIDO -->
      <div class="p-4 bg-slate-900 border-t border-slate-800 flex flex-col sm:flex-row gap-3 items-center">
        <div class="flex-1 w-full flex gap-2">
          <input type="text" id="input-media-url" placeholder="Pega enlace de YouTube o vídeo MP4..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-purple-500 transition">
          <button id="btn-change-video" class="bg-purple-600 hover:bg-purple-500 text-white font-semibold px-5 py-2.5 rounded-xl text-sm transition flex items-center gap-2">
            <span>Cargar</span>
          </button>
        </div>
      </div>
    </div>

    <!-- PANEL LATERAL DE CHAT & AMPHIBOT (IA) -->
    <div class="w-full lg:w-96 bg-slate-900 border-l border-slate-800 flex flex-col h-72 lg:h-full">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <h3 class="font-bold text-slate-200 text-sm flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          Chat de Amphitheater
        </h3>
        <span class="text-[11px] bg-purple-900/50 text-purple-300 border border-purple-500/30 px-2 py-0.5 rounded-md">🤖 AmphiBot Activo</span>
      </div>

      <!-- CONTENEDOR DE MENSAJES -->
      <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm"></div>

      <!-- ENTRADA DE TEXTO CHAT -->
      <div class="p-3 border-t border-slate-800 bg-slate-950 flex gap-2">
        <input type="text" id="input-chat" placeholder="Escribe algo o habla con @amphi..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
        <button id="btn-send-chat" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition">🚀</button>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
