<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amphitheater - Rave Web</title>
  <link rel="stylesheet" href="style.css">
  <!-- Tailwind CSS CDN para estilos rápidos de alta calidad -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PeerJS para Compartir Pantalla y Chat P2P -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.min.js"></script>
  <!-- YouTube API -->
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col font-sans">

  <!-- PANTALLA 1: LOBBY / UNIRSE A SALA -->
  <div id="lobby-screen" class="flex-1 flex flex-col items-center justify-center p-6">
    <div class="bg-gray-900 border border-purple-500/30 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center">
      <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 mb-2">Amphitheater</h1>
      <p class="text-gray-400 mb-6 text-sm">Tu espacio privado para ver videos y compartir pantalla juntos.</p>
      
      <div class="space-y-4">
        <div>
          <label class="block text-left text-xs font-semibold text-gray-400 uppercase mb-1">Tu Nombre / Apodo</label>
          <input type="text" id="username-input" placeholder="Ej: Alejandro" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-purple-500">
        </div>

        <div>
          <label class="block text-left text-xs font-semibold text-gray-400 uppercase mb-1">ID de la Sala</label>
          <input type="text" id="room-input" placeholder="Ej: amor-123" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-purple-500">
        </div>

        <div class="flex gap-3 pt-2">
          <button id="btn-create" class="flex-1 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold py-2.5 rounded-lg transition">Crear / Entrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- PANTALLA 2: SALA PRINCIPAL -->
  <div id="room-screen" class="hidden flex-1 flex flex-col md:flex-row h-screen overflow-hidden">
    
    <!-- ÁREA PRINCIPAL: REPRODUCTOR & CONTROLES -->
    <div class="flex-1 flex flex-col bg-black relative">
      
      <!-- BARRA SUPERIOR DE LA SALA -->
      <div class="bg-gray-900/90 backdrop-blur border-b border-gray-800 px-4 py-3 flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
          <span class="text-purple-400 font-bold text-lg">Amphitheater</span>
          <span id="room-badge" class="bg-purple-900/50 text-purple-300 text-xs px-2.5 py-1 rounded-full border border-purple-500/30">Sala: -</span>
        </div>
        <button id="btn-leave" class="text-xs text-gray-400 hover:text-red-400 transition">Salir de la sala</button>
      </div>

      <!-- REPRODUCTORES (MEDIA CONTAINER) -->
      <div class="flex-1 relative flex items-center justify-center bg-black overflow-hidden">
        <!-- YouTube Player Container -->
        <div id="yt-player-container" class="w-full h-full absolute inset-0 hidden">
          <div id="yt-player" class="w-full h-full"></div>
        </div>

        <!-- HTML5 Video Player Container -->
        <video id="web-video" class="w-full h-full object-contain hidden" controls></video>

        <!-- Screen Share Stream Container -->
        <video id="screen-video" class="w-full h-full object-contain hidden" autoplay playsinline></video>

        <!-- Placeholder Inicial -->
        <div id="media-placeholder" class="text-center p-6">
          <div class="w-16 h-16 mx-auto mb-4 bg-purple-900/30 text-purple-400 rounded-full flex items-center justify-center text-2xl">🎬</div>
          <h3 class="text-xl font-bold mb-1">¡Todo listo para transmitir!</h3>
          <p class="text-gray-400 text-sm">Selecciona una fuente de video o comparte pantalla desde el menú inferior.</p>
        </div>
      </div>

      <!-- SELECTOR DE FUENTE Y CONTROLES -->
      <div class="bg-gray-900 border-t border-gray-800 p-3 flex flex-wrap items-center justify-center gap-3">
        <button id="btn-mode-yt" class="bg-gray-800 hover:bg-gray-700 text-xs px-3 py-2 rounded-lg border border-gray-700 flex items-center gap-1.5">
          <span>▶️</span> YouTube
        </button>
        <button id="btn-mode-web" class="bg-gray-800 hover:bg-gray-700 text-xs px-3 py-2 rounded-lg border border-gray-700 flex items-center gap-1.5">
          <span>🌐</span> Video Web (URL/MP4)
        </button>
        <button id="btn-mode-screen" class="bg-purple-600 hover:bg-purple-500 text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-1.5 transition">
          <span>🖥️</span> Compartir Pantalla
        </button>
      </div>

      <!-- INPUT BAR PARA CARGAR URL -->
      <div id="url-bar" class="hidden bg-gray-950 border-t border-gray-800 p-2 flex gap-2">
        <input type="text" id="media-url-input" placeholder="Pega el enlace de YouTube o archivo MP4..." class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-purple-500">
        <button id="btn-load-media" class="bg-purple-600 hover:bg-purple-500 px-4 py-1.5 rounded-lg text-sm font-semibold">Cargar</button>
      </div>
    </div>

    <!-- PANEL LATERAL: CHAT EN TIEMPO REAL -->
    <div class="w-full md:w-80 bg-gray-900 border-l border-gray-800 flex flex-col h-1/3 md:h-full">
      <div class="p-3 border-b border-gray-800 flex items-center justify-between">
        <h2 class="font-bold text-sm text-gray-200 flex items-center gap-2">
          <span>💬</span> Chat de la Sala
        </h2>
      </div>

      <!-- HISTORIAL DE MENSAJES -->
      <div id="chat-messages" class="flex-1 p-3 overflow-y-auto space-y-3 text-sm">
        <div class="text-xs text-center text-gray-500 my-2">¡Bienvenido a la sala! Escribe un mensaje para conversar.</div>
      </div>

      <!-- CAMPO PARA ENVIAR MENSAJE -->
      <div class="p-3 border-t border-gray-800 flex gap-2 bg-gray-950">
        <input type="text" id="chat-input" placeholder="Escribe un mensaje..." class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
        <button id="btn-send-chat" class="bg-purple-600 hover:bg-purple-500 px-3 py-2 rounded-lg text-sm">🚀</button>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
